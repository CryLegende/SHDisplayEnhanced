info_title: "&7&l« &e&lSH &8&l» &7Décorations de &e%player%"
info_series: "&7• &f%series% &7: &e%done%&7/&e%total%%state%"
info_series_done: " &a(terminée)"
info_reward_paid: " &7, récompense &adonnée"
info_reward_unpaid: " &7, récompense &cnon réservée en base"
info_other: "&7• &f%count%&7 décoration(s) d'une série non chargée"
info_total: "&7Séries terminées : &e%completed%&7/&e%series% &7, décorations enregistrées : &e%items%"
