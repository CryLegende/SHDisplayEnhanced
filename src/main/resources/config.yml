# ======================================================================== #
#                SHDisplayEnhanced - Configuration Principale              #
# ======================================================================== #
#
# Plugin : menu /deco des décorations (display) : séries à compléter en y plaçant les décorations,
# récompense de chaque série terminée, boutique pour revendre les doubles. Les séries sont dans
# collections/*.yml, les prix de vente dans shop.yml, les textes dans messages.yml.
# Avec SHNetwork, les décorations enregistrées et les séries récompensées sont dans la base du réseau
# (voir la section 'reseau' en bas du fichier).
#
# Commandes (la console peut les utiliser) :
#   /deco (alias /decorations)        Ouvre le menu des séries et de la boutique.
#   /shdisplayenhanced reload         Relit config.yml, messages.yml, shop.yml et collections/*.yml. Si un fichier est
#                                     invalide, rien n'est rechargé et le fichier fautif est indiqué. Les décorations
#                                     des joueurs ne sont pas touchées ; la section 'reseau' demande un redémarrage.
#   /shdisplayenhanced import         Avec SHNetwork : copie playerdata.db dans la base du réseau,
#                                     sans toucher aux décorations déjà présentes.
#   /shdisplayenhanced info <joueur>  Affiche la progression d'un joueur : décorations par série, séries terminées
#                                     et, avec SHNetwork, récompense déjà donnée.
#   Alias de /shdisplayenhanced : /shdeco, /shdisplay.
#
# Permissions :
#   shdisplayenhanced.admin          Toutes les sous-commandes (par défaut : op).
#   shdisplayenhanced.admin.reload   /shdisplayenhanced reload (par défaut : op).
#   shdisplayenhanced.admin.import   /shdisplayenhanced import (par défaut : op).
#   shdisplayenhanced.admin.info     /shdisplayenhanced info (par défaut : op).
#   /deco n'a pas de permission : tous les joueurs l'utilisent.
#
# ======================================================================== #

