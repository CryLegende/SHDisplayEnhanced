name: SHDisplayEnhanced
version: '${project.version}'
main: org.Cry_Legende.sHDisplayEnhanced.SHDisplayEnhanced
api-version: '1.20'
author: Cry_Legende
description: Améliore les items de display avec une boutique et un système de collections.
# SHNetwork est facultatif : sans lui, les décorations restent dans playerdata.db de chaque serveur comme avant.
softdepend: [PlaceholderAPI, Vault, SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (décorations en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  deco:
    description: Ouvre le menu principal des collections et de la boutique.
    usage: /<command>
    aliases: [decorations]
  shdisplayenhanced:
    description: Administration de SHDisplayEnhanced.
    usage: /<command> <reload|import|info>
    aliases: [shdeco, shdisplay]

permissions:
  shdisplayenhanced.admin:
    description: Toutes les sous-commandes de /shdisplayenhanced.
    default: op
    children:
      shdisplayenhanced.admin.reload: true
      shdisplayenhanced.admin.import: true
      shdisplayenhanced.admin.info: true
  shdisplayenhanced.admin.reload:
    description: Recharger la configuration, les séries et la boutique (/shdisplayenhanced reload).
    default: op
  shdisplayenhanced.admin.import:
    description: Copier playerdata.db dans la base du réseau (/shdisplayenhanced import, avec SHNetwork).
    default: op
  shdisplayenhanced.admin.info:
    description: Voir la progression d'un joueur (/shdisplayenhanced info).
    default: op
