name: SHDisplayEnhanced
version: '${project.version}'
main: org.Cry_Legende.sHDisplayEnhanced.SHDisplayEnhanced
api-version: '1.20'
author: Cry_Legende
description: Améliore les items de display avec une boutique et un système de collections.
# SHNetwork est facultatif : sans lui, les décorations restent dans playerdata.db de chaque serveur comme avant.
softdepend: [PlaceholderAPI, Vault, SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (décorations en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  deco:
    description: Ouvre le menu principal des collections et de la boutique.
    usage: /<command>
    aliases: [decorations]
  shdeco:
    description: Commande d'administration pour SHDisplayEnhanced.
    usage: /<command> reload
    aliases: [shdisplay]
    permission: shdisplayenhanced.admin

permissions:
  shdisplayenhanced.user:
    description: Permet d'utiliser la commande /deco.
    default: true
  shdisplayenhanced.admin:
    description: Permet d'utiliser les commandes d'administration.
    default: op
